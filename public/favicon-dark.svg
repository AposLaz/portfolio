<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Apostolos Lazidis logo - dark">
  <defs>
    <!-- dark theme gradient (dark primary -> dark accent) -->
    <linearGradient id="lgd" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="tgd" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="shadow-d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="transparent" />
  <g filter="url(#shadow-d)">
    <circle cx="32" cy="32" r="26" fill="url(#lgd)" />
  </g>
  <text x="32" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="url(#tgd)" font-weight="900" stroke="#00000022" stroke-width="0.6">AL</text>
</svg>
