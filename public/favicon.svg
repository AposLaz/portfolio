<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Apostolos Lazidis logo">
  <defs>
    <linearGradient id="lg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#030515" />
      <stop offset="1" stop-color="#07202a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
    <defs>
      <!-- circle gradient using site's primary -> accent -->
      <linearGradient id="lg" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#2563eb" />
        <stop offset="1" stop-color="#06b6d4" />
      </linearGradient>
      <!-- text gradient matching gradient-text -->
      <linearGradient id="tg" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#2563eb" />
        <stop offset="1" stop-color="#06b6d4" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
      </filter>
    </defs>
    <g filter="url(#shadow)">
      <circle cx="32" cy="32" r="26" fill="url(#lg)" />
    </g>
    <!-- gradient-filled initials to match hero.gradient-text -->
    <text x="32" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="url(#tg)" font-weight="900" stroke="#00000022" stroke-width="0.6">AL</text>
      <text x="32" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="url(#tg)" font-weight="900" stroke="#00000022" stroke-width="0.6">AL</text>
</svg>
